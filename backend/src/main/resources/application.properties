spring.application.name=iot-cloud-manager-backend

server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iot_cloud_manager}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# MQTT
mqtt.enabled=${MQTT_ENABLED:true}
mqtt.broker.url=${MQTT_URL:tcp://localhost:1883}
mqtt.client.id=${MQTT_CLIENT_ID:iot-cloud-manager-backend-01}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Application information
info.app.name=IoT Cloud Manager
info.app.description=IoT Cloud Manager Backend
info.app.version=1.0.0
