# Base de départ : broker MQTT et base de données.
# Le backend et le frontend seront ajoutés dans les semaines suivantes.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  simulator:
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    container_name: iot-simulator
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-30}
      SIMULATOR_SENSORS: ${SIMULATOR_SENSORS:-}

  postgres:
    image: postgres:16
    container_name: iot-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mosquitto_data:
  postgres_data:
