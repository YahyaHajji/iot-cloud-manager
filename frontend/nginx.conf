# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name iot-manager-yahya.duckdns.org 51.170.135.236;
    return 301 https://iot-manager-yahya.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    server_name iot-manager-yahya.duckdns.org;

    # Certificat Let's Encrypt, monté depuis /etc/letsencrypt de la VM
    ssl_certificate /etc/letsencrypt/live/iot-manager-yahya.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot-manager-yahya.duckdns.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Application React (routage côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Métriques et santé : jamais exposées sur Internet
    location /actuator/ {
        deny all;
    }
}
