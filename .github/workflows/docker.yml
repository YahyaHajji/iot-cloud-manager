name: Images Docker

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/docker.yml"

jobs:
  build:
    name: Construire les images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vérifie que le Dockerfile fonctionne sur un clone propre (sans target/)
      - name: Image du backend
        run: docker build -t iot-backend:ci backend

      - name: Image du frontend
        run: docker build -t iot-frontend:ci frontend

      - name: Valider le fichier Compose
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config --quiet
