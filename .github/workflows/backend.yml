name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    name: Tests Maven
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # mvnw écrit sous Windows peut contenir des fins de ligne CRLF
      - name: Préparer le Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      # Les tests utilisent H2 en mémoire : aucune base ni broker n'est nécessaire
      - name: Lancer les tests
        run: ./mvnw -B clean test

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/target/surefire-reports
          if-no-files-found: ignore
